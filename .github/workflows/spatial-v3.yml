name: Spatial Ink Native Validation
on:
  pull_request:
    paths:
      - 'packages/KollioApp/Sources/KollioApp/SpatialV3/**'
      - 'packages/KollioApp/Sources/KollioApp/App/KollioApp.swift'
      - 'packages/KollioApp/Tests/KollioAppTests/Spatial*'
      - '.github/workflows/spatial-v3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-spatial:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate native package
        run: swift build --package-path packages/KollioApp
      - name: Validate native spatial and document projection
        run: swift test --package-path packages/KollioApp --filter Spatial
      - name: Exercise native close and reopen journey
        env:
          KOLLIO_SPATIAL_C34_NATIVE: '1'
        run: swift test --package-path packages/KollioApp --filter SpatialNativeWindowJourneyTests
